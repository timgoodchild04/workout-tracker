# Push a tag like v0.5.0 (matching "version" in src-tauri/tauri.conf.json) to publish a release.
# The three desktop platforms and Android build at the same time into a draft release; once all three are
# there, publish_release.py writes latest.json (what the in-app updater reads) from their
# signatures and publishes the draft. Updaters never see a release missing a platform.
# Run it by hand (Actions → Release → Run workflow) to build them all without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: github.event_name == 'push'
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $v"
            exit 1
          fi

      - name: Draft release
        id: draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="macOS: Workout Tracker.app (universal). Windows: the -setup.exe installer. Ubuntu: the .AppImage updates itself from inside the app; the .deb installs normally but updates by downloading the next .deb. Android: open the .apk on the phone (it installs over the previous one).
          Already installed? Use Settings → Updates in the app."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Workout Tracker $GITHUB_REF_NAME" -f body="$body" -F draft=true -q .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          # 22.04 so the AppImage/.deb also run on older Ubuntu releases (glibc).
          - os: ubuntu-22.04
            rust_targets: ""
            args: --bundles appimage,deb
          # NSIS installs per user (no admin prompt) and is what the updater runs on Windows.
          - os: windows-latest
            rust_targets: ""
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # With no release id (a manual run) this only builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # A signed APK for phones (64-bit ARM, e.g. Pixel). Signed with the same keystore
  # every time (ANDROID_KEYSTORE secret, base64), so each one installs over the last.
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=workout-tracker\n' "$RUNNER_TEMP/release.jks" "$ANDROID_KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties

      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --ci

      # With no release id (a manual run) this only builds.
      - name: Upload to the draft release
        if: needs.prepare.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}/assets?name=Workout.Tracker_${v}_android.apk" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --input src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk > /dev/null

  publish:
    needs: [prepare, build, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish_release.py "$GITHUB_REPOSITORY" "${{ needs.prepare.outputs.release_id }}"
