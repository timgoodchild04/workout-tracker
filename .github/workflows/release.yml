# Push a tag like v0.3.0 (matching "version" in src-tauri/tauri.conf.json) to publish a release.
# Builds a universal macOS app and an Ubuntu AppImage + .deb, signs the updates with the
# updater key, and uploads them plus latest.json, which the app's "Check for updates" reads.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One at a time: each platform adds its entry to the same latest.json.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
          # 22.04 so the AppImage/.deb also run on older Ubuntu releases (glibc).
          - os: ubuntu-22.04
            rust_targets: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $v"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Workout Tracker ${{ github.ref_name }}
          releaseBody: |
            macOS: Workout Tracker.app (universal). Ubuntu: the .AppImage updates itself from inside the app; the .deb installs normally but updates by downloading the next .deb.
            Already installed? Use Settings → Updates in the app.
          releaseDraft: false
          args: ${{ matrix.args }}
