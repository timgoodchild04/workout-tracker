<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="2.5" height="10" rx="1"/><rect x="6" y="5" width="3" height="14" rx="1"/><rect x="9" y="11" width="6" height="2" rx="1"/><rect x="15" y="5" width="3" height="14" rx="1"/><rect x="18.5" y="7" width="2.5" height="10" rx="1"/></svg>
        <span>Workout Tracker</span>
      </div>
      <button class="tab" data-view="today">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Today</span></button>
      <button class="tab" data-view="history">
        <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/></svg><span>History</span></button>
      <button class="tab" data-view="progress">
        <svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/></svg><span>Progress</span></button>
      <button class="tab" data-view="programme">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Programme</span></button>
      <button class="tab" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Settings</span></button>
      <div class="sync" id="sync">
        <span class="dot" id="sync-dot"></span>
        <span id="sync-text">Loading…</span>
        <button class="icon-btn" id="refresh" title="Sync with the sheet" aria-label="Sync with the sheet">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>
        </button>
      </div>
    </nav>
    <main id="main" tabindex="-1">
      <div id="notice" class="notice" hidden></div>
      <section id="view"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
