[package]
name = "workout-tracker"
version = "0.2.1"
description = "Workout coach that reads and writes the Workout Tracker Google Sheet"
edition = "2021"

[lib]
name = "workout_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workout-tracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
# xdg-portal: on Linux use the desktop's own file chooser (works inside the AppImage)
# instead of an in-process GTK dialog.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
urlencoding = "2.1.3"
